# Anaconda configuration drop-in for the LSX-VE installer.
# Shipped in images/product.img as /etc/anaconda/conf.d/90-lsxve.conf. Drop-ins
# are read after the Rocky Linux profile, so these values override it without
# depending on a boot option.

[Storage]
# LSX-VE writes a fixed partition layout in the kickstart %pre step (disk chosen and
# confirmed there); Installation Destination is hidden. These defaults only matter if
# someone re-enables the spoke.
default_scheme = PLAIN
file_system_type = ext4
default_partitioning =
    /lsxve/iso (size 32 GiB)
    swap (size 1 GiB)
    /     (min 16 GiB)

[User Interface]
custom_stylesheet = /usr/share/anaconda/pixmaps/lsxve.css
# packages, sources and users are fixed by LSX-VE; the web console
# administrator "admin" uses the root password
hidden_spokes =
    StorageSpoke
    SoftwareSelectionSpoke
    SourceSpoke
    UserSpoke
    SubscriptionSpoke

[License]
eula =
