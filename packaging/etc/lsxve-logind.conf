# LSX-VE: a hypervisor host never suspends. Closing a laptop lid, the suspend/hibernate keys and
# idle time are ignored (the display is switched off by the DCUI after 10 idle minutes instead).
# The power button still shuts the host down cleanly (VMs are stopped by lsxve-vm-autostart).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
HandleHibernateKey=ignore
HandleHibernateKeyLongPress=ignore
IdleAction=ignore
