# LSX-VE: a virtualization host does not use Bluetooth. Laptop Bluetooth chips often lack
# firmware in Rocky Linux and only fill the log with errors ("BCM: firmware Patch file not found",
# "command 0x1003 tx timeout"). Remove this file to use Bluetooth on the host.
blacklist btusb
blacklist bluetooth
install btusb /bin/false
install bluetooth /bin/false
