# LSX-VE: copy the logs of all LSX-VE services and of the hypervisor stack to
# /var/log/lsxve (own 250 MiB partition "oslog"). The journal keeps its own copy.
template(name="LsxveFormat" type="string" string="%timegenerated:::date-rfc3339% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

if ($programname startswith "lsxve") then {
    action(type="omfile" file="/var/log/lsxve/lsxve.log" template="LsxveFormat"
           fileCreateMode="0640" fileGroup="lsxve" dirCreateMode="0750" dirGroup="lsxve")
}
if ($programname startswith "virt" or $programname == "libvirtd" or $programname startswith "lxc"
    or $programname == "qemu-kvm") then {
    action(type="omfile" file="/var/log/lsxve/hypervisor.log" template="LsxveFormat"
           fileCreateMode="0640" fileGroup="lsxve" dirCreateMode="0750" dirGroup="lsxve")
}
